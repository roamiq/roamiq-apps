name: ROAMiQ Cloud
version: 0.6.41
slug: roamiq_cloud
description: Secure remote access for Home Assistant via Cloudflare Tunnel
url: https://cloud.roamiq.com
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8100
panel_icon: mdi:cloud-lock
panel_title: ROAMiQ Cloud
panel_admin: true

options:
  cloud_base_url: "https://cloud.roamiq.com"
  enable_ai_bubble: true
  backup_schedule: nightly
  max_upload_gb_24h: 6
  max_upload_gb_30d: 45
schema:
  cloud_base_url: "url"
  backup_schedule: "list(weekly|nightly|manual)?"
  max_upload_gb_24h: "float(0,500)?"
  max_upload_gb_30d: "float(0,2000)?"
  enable_ai_bubble: "bool?"
  allow_insecure_cloud_url: "bool?"

hassio_api: true
hassio_role: admin
homeassistant_api: true
auth_api: true

map:
  - config:rw
